<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 70" width="760" height="70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f5c42"/><stop offset="0.55" stop-color="#14161c"/><stop offset="1" stop-color="#0d0f14"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect x="2" y="2" width="756" height="66"/></clipPath>
</defs>
<style>
.sw{animation:sw 4.5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-200px)}100%{transform:translateX(960px)}}
.pu{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.fl{animation:fl 2.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
<rect x="2" y="2" width="756" height="66" fill="url(#bg)" stroke="#2dffb2" stroke-width="3"/>
<rect x="8" y="8" width="744" height="54" fill="none" stroke="#2dffb2" stroke-opacity=".25" stroke-width="1" stroke-dasharray="4 4"/>
<g clip-path="url(#cp)"><rect class="sw" x="0" y="0" width="160" height="70" fill="url(#sh)"/></g>
<g class="fl">
<rect x="22" y="16" width="38" height="38" fill="#2dffb2" stroke="#000" stroke-width="3"/>
<rect x="28" y="22" width="26" height="26" fill="#000" fill-opacity=".28"/>
<rect x="32" y="26" width="8" height="8" fill="#fff" fill-opacity=".85"/>
<rect x="42" y="36" width="8" height="8" fill="#fff" fill-opacity=".45"/>
</g>
<text x="80" y="27" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="900" letter-spacing="3" fill="#2dffb2" opacity=".85">LEVEL 10</text>
<text x="82" y="57" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="900" letter-spacing="3" fill="#000" opacity=".7">JOIN MY SERVER</text>
<text x="80" y="55" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="900" letter-spacing="3" fill="#2dffb2">JOIN MY SERVER</text>
<g class="pu">
<rect x="650" y="22" width="10" height="10" fill="#2dffb2"/><rect x="668" y="22" width="10" height="10" fill="#2dffb2" fill-opacity=".6"/>
<rect x="686" y="22" width="10" height="10" fill="#2dffb2" fill-opacity=".3"/><rect x="704" y="22" width="10" height="10" fill="#2dffb2" fill-opacity=".15"/>
<rect x="650" y="40" width="10" height="10" fill="#2dffb2" fill-opacity=".15"/><rect x="668" y="40" width="10" height="10" fill="#2dffb2" fill-opacity=".3"/>
<rect x="686" y="40" width="10" height="10" fill="#2dffb2" fill-opacity=".6"/><rect x="704" y="40" width="10" height="10" fill="#2dffb2"/>
</g>
</svg>